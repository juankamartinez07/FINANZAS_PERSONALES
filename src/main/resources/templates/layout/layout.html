<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(pageTitle, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} + ' | Finanzas Personales'">Finanzas Personales</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/layout.css}">
    <link rel="stylesheet" th:href="@{/css/sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/transacciones.css}">
    <link rel="stylesheet" th:href="@{/css/cuentas.css}">
    <link rel="stylesheet" th:href="@{/css/deudas.css}">
    <link rel="stylesheet" th:href="@{/css/ahorros.css}">
    <link rel="stylesheet" th:href="@{/css/gastosfijos.css}">
    <link rel="stylesheet" th:href="@{/css/conceptos.css}">
    <link rel="stylesheet" th:href="@{/css/reportes.css}">
    <link rel="stylesheet" th:href="@{/css/analisis-financiero.css}">
    <link rel="stylesheet" th:href="@{/css/responsive.css}">
</head>
<body>
<div class="app-shell">
    <div class="sidebar-backdrop" data-sidebar-close></div>

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <div class="app-main">
        <div th:replace="~{fragments/navbar :: navbar}"></div>

        <main class="content-wrapper">
            <div th:replace="${content}"></div>
        </main>

        <div th:replace="~{fragments/footer :: footer}"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
<script th:src="@{/js/sidebar.js}"></script>
<script th:src="@{/js/dashboard.js}"></script>
<script th:src="@{/js/transacciones.js}"></script>
<script th:src="@{/js/cuentas.js}"></script>
<script th:src="@{/js/deudas.js}"></script>
<script th:src="@{/js/ahorros.js}"></script>
<script th:src="@{/js/gastosfijos.js}"></script>
<script th:src="@{/js/conceptos.js}"></script>
</body>
</html>
