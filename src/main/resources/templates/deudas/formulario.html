<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: layout(${tituloFormulario}, ~{::section})}">
<section class="debts-page">
    <div class="page-heading">
        <div>
            <p class="eyebrow">Deudas</p>
            <h1 th:text="${tituloFormulario}">Deuda</h1>
            <p class="page-description">Registra la obligacion y actualiza el saldo pendiente desde la edicion.</p>
        </div>
        <a class="soft-action" th:href="@{/deudas}">
            <i class="bi bi-arrow-left"></i>
            <span>Volver al listado</span>
        </a>
    </div>

    <div class="alert alert-danger" role="alert" th:if="${mensajeError}" th:text="${mensajeError}"></div>

    <form class="debt-form-card" method="post" th:action="${formAction}" th:object="${deuda}" data-debt-form>
        <div class="form-grid debt-form-grid">
            <div class="form-field">
                <label for="nombre">Nombre</label>
                <input id="nombre" type="text" th:field="*{nombre}" required maxlength="120" placeholder="Ej. Tarjeta de credito">
            </div>
            <div class="form-field">
                <label for="entidad">Entidad</label>
                <input id="entidad" type="text" th:field="*{entidad}" required maxlength="120" placeholder="Ej. Banco">
            </div>
            <div class="form-field">
                <label for="saldoInicial">Saldo inicial</label>
                <input id="saldoInicial" type="number" th:field="*{saldoInicial}" min="1" step="0.01" required data-saldo-inicial>
            </div>
            <div class="form-field">
                <label for="saldoActual">Saldo actual</label>
                <input id="saldoActual" type="number" th:field="*{saldoActual}" min="0" step="0.01" required data-saldo-actual>
            </div>
            <div class="form-field">
                <label for="cuotaMinima">Cuota minima</label>
                <input id="cuotaMinima" type="number" th:field="*{cuotaMinima}" min="0" step="0.01" required>
            </div>
            <div class="form-field">
                <label for="fechaInicio">Fecha de inicio</label>
                <input id="fechaInicio" type="date" th:field="*{fechaInicio}" required>
            </div>
            <div class="form-field">
                <label for="fechaVencimiento">Fecha de vencimiento</label>
                <input id="fechaVencimiento" type="date" th:field="*{fechaVencimiento}">
            </div>
            <div class="form-field">
                <label for="cuenta">Cuenta</label>
                <select id="cuenta" th:field="*{cuenta.idCuenta}" required>
                    <option value="">Selecciona una cuenta</option>
                    <option th:each="cuentaItem : ${cuentas}"
                            th:value="${cuentaItem.idCuenta}"
                            th:text="${cuentaItem.nombre}">
                        Cuenta
                    </option>
                </select>
            </div>
            <div class="form-field" th:if="${mostrarActivo}">
                <label for="activo">Estado</label>
                <select id="activo" th:field="*{activo}">
                    <option th:value="true">Activa</option>
                    <option th:value="false">Inactiva</option>
                </select>
            </div>
        </div>

        <section class="debt-form-progress">
            <div>
                <span>Progreso estimado</span>
                <strong data-progress-label>0 %</strong>
            </div>
            <div class="debt-progress" data-progress-bar style="--progress: 0%;">
                <span></span>
            </div>
        </section>

        <div class="form-actions">
            <a class="soft-action" th:href="@{/deudas}">Cancelar</a>
            <button class="soft-action primary-action" type="submit">
                <i class="bi bi-check2"></i>
                <span>Guardar deuda</span>
            </button>
        </div>
    </form>
</section>
</html>
