<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: layout(${tituloFormulario}, ~{::section})}">
<section class="fixed-expenses-page">
    <div class="page-heading">
        <div>
            <p class="eyebrow">Gastos Fijos</p>
            <h1 th:text="${tituloFormulario}">Gasto fijo</h1>
            <p class="page-description">Configura una plantilla mensual. Este registro no genera transacciones automaticamente.</p>
        </div>
        <a class="soft-action" th:href="@{/gastosfijos}">
            <i class="bi bi-arrow-left"></i>
            <span>Volver al listado</span>
        </a>
    </div>

    <div class="alert alert-danger" role="alert" th:if="${mensajeError}" th:text="${mensajeError}"></div>

    <form class="fixed-form-card" method="post" th:action="${formAction}" th:object="${gastoFijo}" data-fixed-form>
        <div class="form-grid fixed-form-grid">
            <div class="form-field">
                <label for="nombre">Nombre</label>
                <input id="nombre" type="text" th:field="*{nombre}" required maxlength="120" placeholder="Ej. Internet hogar">
            </div>
            <div class="form-field">
                <label for="valor">Valor</label>
                <input id="valor" type="number" th:field="*{valor}" min="1" step="0.01" required>
            </div>
            <div class="form-field">
                <label for="diaPago">Dia de pago</label>
                <input id="diaPago" type="number" th:field="*{diaPago}" min="1" max="31" step="1" required data-fixed-day>
            </div>
            <div class="form-field">
                <label for="cuenta">Cuenta</label>
                <select id="cuenta" th:field="*{cuenta.idCuenta}" required>
                    <option value="">Selecciona una cuenta</option>
                    <option th:each="cuentaItem : ${cuentas}"
                            th:value="${cuentaItem.idCuenta}"
                            th:text="${cuentaItem.nombre}">
                        Cuenta
                    </option>
                </select>
            </div>
            <div class="form-field">
                <label for="concepto">Concepto</label>
                <select id="concepto" th:field="*{concepto.idConcepto}" required>
                    <option value="">Selecciona un concepto</option>
                    <option th:each="conceptoItem : ${conceptos}"
                            th:value="${conceptoItem.idConcepto}"
                            th:text="${conceptoItem.nombre}">
                        Concepto
                    </option>
                </select>
            </div>
            <div class="form-field" th:if="${mostrarActivo}">
                <label for="activo">Estado</label>
                <select id="activo" th:field="*{activo}">
                    <option th:value="true">Activo</option>
                    <option th:value="false">Inactivo</option>
                </select>
            </div>
        </div>

        <section class="fixed-preview">
            <span>Proxima fecha estimada</span>
            <strong data-fixed-preview>Define un dia de pago</strong>
        </section>

        <div class="form-actions">
            <a class="soft-action" th:href="@{/gastosfijos}">Cancelar</a>
            <button class="soft-action primary-action" type="submit">
                <i class="bi bi-check2"></i>
                <span>Guardar gasto fijo</span>
            </button>
        </div>
    </form>
</section>
</html>
